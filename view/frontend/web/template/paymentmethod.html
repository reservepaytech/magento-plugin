<div class="payment-method" data-bind="css: {'_active': (getCode() === isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <img data-bind="attr: { src: require.toUrl('Reservepay_Payment/images/reservepay_small.svg'), alt: '[Reservepay]' }" style="vertical-align: middle;" />
        <label class="label" data-bind="attr: {'for': getCode()}">
            <span data-bind="text: getTitle()"></span>
            <!-- ko with: getGroup() -->
            <span class="reservepay-logos" style="display: inline-flex; gap: 6px; align-items: center; vertical-align: middle; margin-left: 8px;">
                <!-- ko foreach: logos -->
                <img data-bind="attr: {src: src, alt: alt, title: alt}" width="24" height="24" style="width: 24px; height: 24px;"/>
                <!-- /ko -->
                <!-- ko if: more > 0 -->
                <span data-bind="text: '+' + more" style="border: 1px solid #ccc; border-radius: 4px; font-size: 12px; line-height: 22px; min-width: 22px; padding: 0 3px; text-align: center;"></span>
                <!-- /ko -->
            </span>
            <!-- /ko -->
        </label>
    </div>

    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        attr: {title: $t('Place Order')}
                        ">
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
